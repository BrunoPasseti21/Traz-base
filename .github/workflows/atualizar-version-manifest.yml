name: Atualizar manifest de versão

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  atualizar-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Atualizar version.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSIO="${TAG#v}"
          URL="https://github.com/${REPO}/releases/download/${TAG}/TrazBase-Setup.exe"
          # Ao republicar a MESMA versão, preserva a tag de rebuild (r2, r3...) para que
          # o app ofereça a atualização mesmo sem mudança no número da versão.
          OLD_VERSION=$(jq -r '.version // ""' version.json)
          OLD_TAG=$(jq -r '.tag // ""' version.json)
          if [ "$VERSIO" = "$OLD_VERSION" ]; then TAG_VALUE="$OLD_TAG"; else TAG_VALUE=""; fi
          jq -n --arg version "$VERSIO" --arg tag "$TAG_VALUE" --arg installerUrl "$URL" \
            '{version: $version, tag: $tag, installerUrl: $installerUrl}' > version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json já está atualizado."
          else
            git commit -m "Atualiza version.json para ${TAG}"
            git push origin main
          fi
